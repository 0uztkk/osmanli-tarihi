name: Osmanli onizleme (yuklemez)

# Yükleme yapmadan örnek video üretir; video Actions çıktısı (artifact) olarak indirilir.
on:
  push:
    branches: [main]
    paths: ["osmanli/onizleme_istek.txt"]
  workflow_dispatch:
    inputs:
      kategori:
        description: "Kategori (savaslar / saray / kisiler)"
        default: "savaslar"
      konu:
        description: "Konu id"
        default: ""
      kapanis:
        description: "Video sonu (bos = takvime gore; yarin/bildin/puan/oneri/uzun/takip/duz)"
        default: ""

permissions:
  contents: write

jobs:
  onizleme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Örnek video üret
        env:
          KATEGORI: ${{ github.event.inputs.kategori || 'savaslar' }}
          KONU: ${{ github.event.inputs.konu }}
          KAPANIS: ${{ github.event.inputs.kapanis }}
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
        run: |
          set -o pipefail
          python osmanli/build.py 2>&1 | tee out_log.txt
          mv out_log.txt out/log.txt
          mkdir -p out/kareler
          for t in 1 6 15 25 35; do ffmpeg -y -loglevel error -ss $t -i out/video.mp4 -frames:v 1 -vf scale=540:-1 out/kareler/k$t.jpg || true; done
      - name: Görsel adaylarını çıkar (osmanli/onizleme_aramalar.txt varsa)
        if: always()
        run: |
          if [ -f osmanli/onizleme_aramalar.txt ]; then python osmanli/gorsel_ara.py osmanli/onizleme_aramalar.txt; fi
      - name: Çıktıları onizleme-ciktilari dalına koy
        if: always()
        run: |
          mkdir -p /tmp/cikti && for f in out/video.mp4 out/meta.json out/log.txt out/kareler out/ara; do cp -r $f /tmp/cikti/ 2>/dev/null || true; done
          cd /tmp/cikti
          git init -q -b onizleme-ciktilari
          git -c user.name=onizleme -c user.email=onizleme@users.noreply.github.com add -A
          git -c user.name=onizleme -c user.email=onizleme@users.noreply.github.com commit -q -m "Onizleme ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" onizleme-ciktilari
      - uses: actions/upload-artifact@v4
        with:
          name: onizleme
          path: |
            out/video.mp4
            out/meta.json
            out/kareler/
            out/img/
          retention-days: 7
