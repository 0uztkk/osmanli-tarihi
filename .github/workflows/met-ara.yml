name: Met acik arsiv gorsel adaylari (yuklemez)

# The Met Open Access arşivinde kamu malı eser arar, seçim için numaralı sayfaları met-adaylar dalına koyar.
on:
  workflow_dispatch:
    inputs:
      aramalar:
        description: "Aramalar, '|' ile ayrılmış (boş = osmanli/met_istek.txt ya da varsayılan Osmanlı aramaları)"
        default: ""
  push:
    branches: [main]
    paths: ["osmanli/met_istek.txt"]

permissions:
  contents: write

jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: API tanı (durum kodları)
        run: |
          for u in "public/collection/v1.1/search?q=ottoman&hasImages=true&limit=5" "public/collection/v1.1/search?q=ottoman&hasImages=true&limit=5&offset=5"; do
            echo "$(curl -s -o /tmp/r.txt -w '%{http_code}' "https://collectionapi.metmuseum.org/$u") $u :: $(head -c 300 /tmp/r.txt)" | tee -a met_tani.txt
          done
      - name: Ara
        env:
          ARAMALAR: ${{ github.event.inputs.aramalar }}
        run: |
          set -o pipefail
          if [ -n "$ARAMALAR" ]; then
            IFS='|' read -ra A <<< "$ARAMALAR"
            python osmanli/araclar/met_ara.py "${A[@]}" 2>&1 | tee met_log.txt
          else
            python osmanli/araclar/met_ara.py 2>&1 | tee met_log.txt
          fi
      - name: met-adaylar dalına koy
        if: always()
        run: |
          mkdir -p /tmp/cikti && cp -r out/met/. /tmp/cikti/ 2>/dev/null || true
          cp met_log.txt met_tani.txt /tmp/cikti/ 2>/dev/null || true
          cd /tmp/cikti
          git init -q -b met-adaylar
          git -c user.name=met -c user.email=met@users.noreply.github.com add -A
          git -c user.name=met -c user.email=met@users.noreply.github.com commit -q -m "Met adaylari ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" met-adaylar
