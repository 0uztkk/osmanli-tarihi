name: Osmanli yorum raporu (yt-comment)

# Her gün son videoların yorumlarını ayırır, yanıt taslaklarını Actions özetine yazar.
# Hiçbir yorum otomatik yanıtlanmaz; sen YouTube Studio'dan gönderirsin.
on:
  schedule:
    - cron: "37 18 * * *"   # her gün 21:37 (TR)
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük video"
        default: "3"

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Yorumları ayır
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python osmanli/yorumlar.py "${{ github.event.inputs.gun || '3' }}"
