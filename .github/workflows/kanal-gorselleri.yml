name: Kanal gorselleri

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["osmanli/araclar/kanal_gorselleri_tablo.py"]

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq fonts-crosextra-caladea fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0 numpy==2.1.3
      - run: python osmanli/araclar/kanal_gorselleri_tablo.py /tmp/kanal
      - name: kanal-gorselleri dalına koy
        run: |
          cd /tmp/kanal
          git init -q -b kanal-gorselleri
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m "Kanal gorselleri ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" kanal-gorselleri
